<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Dev Chart Workspace</title>
    <script src="/libs/klinecharts.min.js"></script>
    <script>
    if (!window.ResizeObserver) {
        window.ResizeObserver = function(callback) {
            this.callback = callback;
            this.observe = function(el) { this.el = el; };
            this.unobserve = function() {};
            this.disconnect = function() {};
        };
    }
    </script>
    <script>
    // ChartWorkspace — shared panel/workspace model (inline so both panels can use it)
    (function() {
        var PANEL_TYPES = ['smc', 'footprint'];
        function createPanel(options) {
            options = options || {};
            var type = options.type || 'smc';
            if (PANEL_TYPES.indexOf(type) === -1) throw new Error('Unknown panel type: ' + type);
            return {
                id: options.id || ('panel-' + Math.random().toString(36).slice(2, 10)),
                type: type,
                symbol: options.symbol || '',
                timeframe: options.timeframe || '',
                chartStyle: options.chartStyle || '',
                indicators: options.indicators || {},
                drawings: options.drawings || [],
                overlays: options.overlays || [],
                markers: options.markers || [],
                data: options.data || null,
                ui: options.ui || null,
                hooks: options.hooks || null,
                private: options.private || {}
            };
        }
        function createWorkspace() {
            var panels = [], activePanelId = null;
            return {
                panels: panels,
                activePanelId: activePanelId,
                addPanel: function(p) { panels.push(p); if (!activePanelId) activePanelId = p.id; return p; },
                removePanel: function(id) {
                    var i = panels.indexOf(panels.filter(function(x){return x.id===id;})[0]);
                    if (i === -1) return null;
                    var r = panels.splice(i,1)[0];
                    if (activePanelId === id) activePanelId = panels.length ? panels[0].id : null;
                    return r;
                },
                getPanel: function(id) { return panels.filter(function(x){return x.id===id;})[0] || null; },
                allPanels: function() { return panels.slice(); }
            };
        }
        window.ChartWorkspace = { createPanel: createPanel, createWorkspace: createWorkspace, PANEL_TYPES: PANEL_TYPES };
    })();
    </script>
    <style>
        :root {
            --bg: #070b12; --panel: #0d141e; --panel-raised: #121c28;
            --grid: #213040; --text: #e7eef7; --muted: #7f91a5;
            --green: #64e6a0; --red: #ff7887; --cyan: #58d9e8; --amber: #f5c96a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 42% -18%, #173042 0, transparent 42%), var(--bg);
            color: var(--text); font: 12px "SF Mono", "Fira Code", Consolas, monospace;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header {
            min-height: 56px; display: flex; align-items: center; gap: 12px;
            padding: 10px 18px; border-bottom: 1px solid var(--grid);
            background: rgba(13,20,30,.95); flex-wrap: wrap;
        }
        h1 { margin: 0; color: var(--cyan); font-size: 14px; letter-spacing: .08em; white-space: nowrap; }
        h1::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 9px 2px 0;
            border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
        .workspace-controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
        select, button {
            border: 1px solid var(--grid); border-radius: 5px; background: rgba(18,28,40,.9);
            color: var(--text); padding: 6px 10px; font: inherit; cursor: pointer;
            transition: border-color .18s ease, background .18s ease;
        }
        select { min-width: 90px; }
        button:hover, select:focus { border-color: var(--cyan); background: var(--panel-raised); outline: none; }
        button:active { transform: translateY(1px); }
        button.primary { background: var(--cyan); color: #061017; border-color: var(--cyan); font-weight: 600; }
        button.primary:hover { background: #7be0f0; }
        button.danger { border-color: var(--red); color: var(--red); }
        button.danger:hover { background: rgba(255,120,135,.15); }
        .sync-toggle {
            display: flex; align-items: center; gap: 6px; padding: 4px 10px;
            border: 1px solid var(--grid); border-radius: 5px; background: rgba(18,28,40,.9);
            cursor: pointer; user-select: none;
        }
        .sync-toggle.active { border-color: var(--cyan); background: rgba(88,217,232,.1); }
        .sync-toggle input { accent-color: var(--cyan); }
        .sync-label { font-size: 11px; color: var(--muted); }
        .workspace-grid {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            grid-auto-rows: minmax(400px, 1fr); gap: 8px; padding: 12px; min-height: 0; overflow: auto;
        }
        .chart-panel {
            background: var(--panel); border: 1px solid var(--grid); border-radius: 6px;
            display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative;
        }
        .panel-header {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            border-bottom: 1px solid var(--grid); background: rgba(18,28,40,.6); flex-shrink: 0;
        }
        .panel-type-badge {
            font-size: 9px; padding: 2px 6px; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase;
        }
        .panel-type-badge.footprint { background: rgba(100,230,160,.15); color: var(--green); border: 1px solid rgba(100,230,160,.3); }
        .panel-type-badge.smc { background: rgba(88,217,232,.15); color: var(--cyan); border: 1px solid rgba(88,217,232,.3); }
        .panel-controls { display: flex; gap: 6px; align-items: center; flex: 1; }
        .panel-controls select { padding: 4px 6px; font-size: 11px; min-width: 0; }
        .panel-controls select.symbol-select { width: 90px; }
        .panel-controls select.interval-select { width: 70px; }
        .panel-actions { display: flex; gap: 4px; }
        .panel-actions button { padding: 3px 8px; font-size: 11px; }
        .panel-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
        .panel-body.smc-panel { display: flex; flex-direction: column; }
        .panel-body.smc-panel #chart-container { flex: 1; min-height: 0; }
        .panel-body.smc-panel .smc-side {
            width: 200px; border-left: 1px solid var(--grid); background: rgba(9,15,23,.7);
            overflow-y: auto; padding: 8px; font-size: 10px; flex-shrink: 0;
        }
        .panel-status {
            position: absolute; top: 8px; right: 10px; font-size: 9px; color: var(--muted);
            letter-spacing: .04em; z-index: 5; pointer-events: none;
        }
        .panel-status.loaded { color: var(--green); }
        @media (max-width: 960px) {
            .workspace-grid { grid-template-columns: 1fr; grid-auto-rows: minmax(380px, auto); }
        }
    </style>
</head>
<body>
    <header>
        <h1>CHART WORKSPACE</h1>
        <div class="workspace-controls">
            <select id="global-symbol">
                <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option>
            </select>
            <select id="global-interval">
                <option value="60">1m</option><option value="300">5m</option><option value="900">15m</option>
            </select>
            <label class="sync-toggle active" id="sync-toggle">
                <input type="checkbox" id="sync-enabled" checked>
                <span class="sync-label">SYNC symbol+interval</span>
            </label>
            <button id="add-panel" class="primary">+ ADD PANEL</button>
        </div>
    </header>
    <main class="workspace-grid" id="workspace-grid"></main>

<script>
// KLineChart v9.6.0 (Apache 2.0) — pinned local copy
// fabric.js v7.4.0 (MIT) — pinned local copy
</script>
<script src="/libs/klinecharts.min.js"></script>
<script src="/libs/fabric.min.js"></script>
<script>
(function() {
    'use strict';
    var CW = window.ChartWorkspace;
    if (!CW) throw new Error('ChartWorkspace not available');

    var workspace = CW.createWorkspace();
    var syncEnabled = document.getElementById('sync-enabled').checked;
    var syncToggle = document.getElementById('sync-toggle');
    syncToggle.classList.add('active');
    document.getElementById('sync-enabled').addEventListener('change', function() {
        syncEnabled = this.checked;
        syncToggle.classList.toggle('active', syncEnabled);
    });

    var panelCounter = 0;

    // Minimal SMC panel renderer using KLineChart v9
    function makeSmcPanel(symbol, timeframe) {
        panelCounter++;
        var panel = CW.createPanel({
            type: 'smc',
            symbol: symbol || 'BTCUSDT',
            timeframe: timeframe || '60',
            data: { smcData: null, obLines: [], fvgAreas: [], liqLines: [], rbiHighlightedStrategy: null },
            ui: { chartContainer: null, chart: null, overlayCanvas: null, overlayCtx: null, fabricCanvas: null },
            hooks: { load: smcLoad }
        });

        var grid = document.getElementById('workspace-grid');
        var panelDiv = document.createElement('div');
        panelDiv.id = 'panel-' + panel.id;
        panelDiv.className = 'chart-panel';

        var header = document.createElement('div');
        header.className = 'panel-header';
        header.innerHTML =
            '<span class="panel-type-badge smc">SMC</span>' +
            '<div class="panel-controls">' +
                '<select class="symbol-select" data-panel="' + panel.id + '">' +
                    '<option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option>' +
                '</select>' +
                '<select class="interval-select" data-panel="' + panel.id + '">' +
                    '<option value="60">1m</option><option value="300">5m</option><option value="900">15m</option>' +
                '</select>' +
            '</div>' +
            '<div class="panel-actions">' +
                '<button class="danger remove-panel" data-panel="' + panel.id + '" title="Close panel">✕</button>' +
            '</div>';
        panelDiv.appendChild(header);
        var body = document.createElement('div');
        body.className = 'panel-body smc-panel';
        body.id = 'panel-body-' + panel.id;
        panelDiv.appendChild(body);

        var chartContainer = document.createElement('div');
        chartContainer.id = 'smc-chart-container-' + panel.id;
        chartContainer.style.cssText = 'flex:1;min-height:0;position:relative;';
        body.appendChild(chartContainer);

        var overlayCanvas = document.createElement('canvas');
        overlayCanvas.id = 'smc-overlay-' + panel.id;
        overlayCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;';
        body.appendChild(overlayCanvas);

        var sidePanel = document.createElement('div');
        sidePanel.className = 'smc-side';
        sidePanel.id = 'smc-side-' + panel.id;
        sidePanel.innerHTML = '<div style="color:var(--cyan);font-size:10px;font-weight:600;margin-bottom:6px;letter-spacing:.06em;">SMC ANALYSIS</div>' +
            '<div id="smc-content-' + panel.id + '" style="color:var(--muted);font-size:9px;">Loading...</div>';
        body.appendChild(sidePanel);

        var status = document.createElement('div');
        status.className = 'panel-status';
        status.id = 'smc-status-' + panel.id;
        status.textContent = 'Initializing KLineChart...';
        panelDiv.appendChild(status);

        grid.appendChild(panelDiv);

        panel.ui.chartContainer = chartContainer;
        panel.ui.overlayCanvas = overlayCanvas;

        var symSelect = header.querySelector('.symbol-select');
        symSelect.value = panel.symbol;
        symSelect.addEventListener('change', function() {
            panel.symbol = symSelect.value;
            if (syncEnabled) {
                workspace.allPanels().forEach(function(other) {
                    if (other.id !== panel.id) {
                        var os = document.querySelector('.symbol-select[data-panel="' + other.id + '"]');
                        if (os) os.value = panel.symbol;
                        other.symbol = panel.symbol;
                        if (other.hooks && other.hooks.load) other.hooks.load(other);
                    }
                });
            }
            if (panel.hooks && panel.hooks.load) panel.hooks.load(panel);
        });

        var intSelect = header.querySelector('.interval-select');
        intSelect.value = panel.timeframe;
        intSelect.addEventListener('change', function() {
            panel.timeframe = intSelect.value;
            if (syncEnabled) {
                workspace.allPanels().forEach(function(other) {
                    if (other.id !== panel.id) {
                        var oi = document.querySelector('.interval-select[data-panel="' + other.id + '"]');
                        if (oi) oi.value = panel.timeframe;
                        other.timeframe = panel.timeframe;
                        if (other.hooks && other.hooks.load) other.hooks.load(other);
                    }
                });
            }
            if (panel.hooks && panel.hooks.load) panel.hooks.load(panel);
        });

        header.querySelector('.remove-panel').addEventListener('click', function() {
            grid.removeChild(panelDiv);
            workspace.removePanel(panel.id);
        });

        workspace.addPanel(panel);

        // Initialize KLineChart
        try {
            var containerEl = chartContainer;
            var cw = containerEl.clientWidth || 400;
            var ch = containerEl.clientHeight || 300;
            panel.ui.chart = klinecharts.init(containerEl, {
                styles: {
                    candle: {
                        upColor: '#4ade80', downColor: '#f87171', noChangeColor: '#666',
                        upBorderColor: '#4ade80', downBorderColor: '#f87171'
                    },
                    grid: { verticalColor: '#1e1e2e', horizontalColor: '#1e1e2e' },
                    xAxis: { textColor: '#666', textSize: 10 },
                    yAxis: { textColor: '#666', textSize: 10, formatter: function(v) { return Number(v).toFixed(2); } }
                }
            });
            status.textContent = 'KLineChart ready';
            status.classList.add('loaded');

            // Overlay canvas for SMC markers
            var oc = document.getElementById('smc-overlay-' + panel.id);
            oc.width = cw;
            oc.height = ch;

            // Resize handler
            var ro = new ResizeObserver(function() {
                var w = containerEl.clientWidth || 400;
                var h = containerEl.clientHeight || 300;
                if (panel.ui.chart && panel.ui.chart.setSize) panel.ui.chart.setSize(w, h);
                oc.width = w;
                oc.height = h;
            });
            ro.observe(containerEl);

            // Load data
            smcLoad(panel);
        } catch(e) {
            status.textContent = 'KLineChart error: ' + e.message;
            console.error('KLineChart init error:', e);
        }
    }

    function smcLoad(panel) {
        var sym = panel.symbol;
        var statusEl = document.getElementById('smc-status-' + panel.id);
        if (statusEl) statusEl.textContent = 'Loading ' + sym + '...';
        fetch('/api/smc?symbol=' + sym + '&timeframe=' + panel.timeframe)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                panel.data.smcData = data;
                if (statusEl) statusEl.textContent = 'Loaded: ' + sym;
                if (statusEl) statusEl.classList.add('loaded');
                renderSmcChart(panel);
                analyzeSmc(panel);
            })
            .catch(function(err) {
                if (statusEl) statusEl.textContent = 'Error: ' + err.message;
            });
    }

    function renderSmcChart(panel) {
        if (!panel.ui.chart || !panel.data.smcData || !panel.data.smcData.candles) return;
        var candles = panel.data.smcData.candles;
        var data = candles.map(function(c) {
            return {
                timestamp: c.time,
                open: c.open, high: c.high, low: c.low, close: c.close,
                volume: c.volume || 0
            };
        });
        try {
            panel.ui.chart.setData(data);
        } catch(e) {
            console.warn('KLineChart setData error:', e.message);
        }
        drawSmcOverlays(panel);
    }

    function drawSmcOverlays(panel) {
        var canvas = panel.ui.overlayCanvas;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (!panel.data.smcData || !panel.data.smcData.candles || !panel.data.smcData.candles.length) return;
        var candles = panel.data.smcData.candles;
        if (!candles.length) return;
        var firstT = candles[0].time, lastT = candles[candles.length-1].time;
        var minP = Infinity, maxP = -Infinity;
        candles.forEach(function(c) { if (c.low < minP) minP = c.low; if (c.high > maxP) maxP = c.high; });
        if (minP === Infinity) minP = 0;
        if (maxP === -Infinity) maxP = 1;
        var pr = maxP - minP || 1, tr = lastT - firstT || 1;
        var cw = canvas.clientWidth || 400, ch = canvas.clientHeight || 300;
        var pad = { top: 8, right: 8, bottom: 16, left: 8 };
        var pw = cw - pad.left - pad.right, ph = ch - pad.top - pad.bottom;
        function t2x(t) { return pad.left + (t - firstT) / tr * pw; }
        function p2y(p) { return pad.top + (maxP - p) / pr * ph; }

        (panel.data.obLines || []).forEach(function(ob) {
            var x = t2x(ob.time), y1 = p2y(ob.high), y2 = p2y(ob.low);
            var col = ob.type === 'demand' ? '#4ade80' : '#f87171';
            ctx.fillStyle = ob.type === 'demand' ? 'rgba(74,222,128,0.2)' : 'rgba(248,113,113,0.2)';
            ctx.strokeStyle = col; ctx.lineWidth = 1;
            ctx.fillRect(x - 4, y2, 8, y1 - y2);
            ctx.strokeRect(x - 4, y2, 8, y1 - y2);
            ctx.fillStyle = col; ctx.font = '9px monospace';
            ctx.fillText(ob.type.toUpperCase(), x + 10, y2 + 10);
        });
        (panel.data.fvgAreas || []).forEach(function(fvg) {
            var x = t2x(fvg.time), y1 = p2y(fvg.high), y2 = p2y(fvg.low);
            ctx.fillStyle = 'rgba(251,191,36,0.15)';
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1;
            ctx.fillRect(x - 2, y2, 4, y1 - y2);
            ctx.strokeRect(x - 2, y2, 4, y1 - y2);
        });
        (panel.data.liqLines || []).forEach(function(liq) {
            var y = p2y(liq.price);
            if (y < pad.top || y > pad.top + ph) return;
            ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#a78bfa'; ctx.font = '8px monospace';
            ctx.fillText('$' + liq.price.toFixed(2), pad.left + pw - 45, y - 2);
        });
    }

    function analyzeSmc(panel) {
        var content = document.getElementById('smc-content-' + panel.id);
        if (!content) return;
        var candles = panel.data.smcData && panel.data.smcData.candles;
        if (!candles || !candles.length) { content.innerHTML = '<span style="color:var(--muted)">No data</span>'; return; }
        var obLines = [], fvgAreas = [], liqLines = [];
        for (var i = 2; i < candles.length - 2; i++) {
            if (candles[i].close > candles[i-1].close && candles[i-1].close > candles[i-2].close)
                obLines.push({ time: candles[i].time, high: candles[i].high, low: candles[i].low, type: 'demand' });
            if (candles[i].close < candles[i-1].close && candles[i-1].close < candles[i-2].close)
                obLines.push({ time: candles[i].time, high: candles[i].high, low: candles[i].low, type: 'supply' });
            if (candles[i].high < candles[i+1].low)
                fvgAreas.push({ time: candles[i+1].time, high: candles[i+1].low, low: candles[i].high });
            if (candles[i].low > candles[i+1].high)
                fvgAreas.push({ time: candles[i+1].time, high: candles[i+1].high, low: candles[i].low });
        }
        var rh = [], rl = [];
        for (var j = candles.length - 20; j < candles.length; j++) {
            if (j > 0 && j < candles.length - 1) {
                if (candles[j].high > candles[j-1].high && candles[j].high > candles[j+1].high)
                    rh.push({ price: candles[j].high, time: candles[j].time });
                if (candles[j].low < candles[j-1].low && candles[j].low < candles[j+1].low)
                    rl.push({ price: candles[j].low, time: candles[j].time });
            }
        }
        panel.data.obLines = obLines;
        panel.data.fvgAreas = fvgAreas;
        panel.data.liqLines = rh.concat(rl);
        var bos = 0;
        for (var k = 3; k < candles.length - 3; k++) {
            if (candles[k].close > candles[k-1].close && candles[k-1].close > candles[k-2].close && candles[k-2].close > candles[k-3].close) bos++;
            if (candles[k].close < candles[k-1].close && candles[k-1].close < candles[k-2].close && candles[k-2].close < candles[k-3].close) bos++;
        }
        var html = '<div style="margin-bottom:6px;">' +
            '<span style="color:#4ade80;font-size:10px;">Demand: ' + obLines.filter(function(o){return o.type==='demand';}).length + '</span> ' +
            '<span style="color:#f87171;font-size:10px;">Supply: ' + obLines.filter(function(o){return o.type==='supply';}).length + '</span> ' +
            '<span style="color:#fbbf24;font-size:10px;">FVG: ' + fvgAreas.length + '</span> ' +
            '<span style="color:#a78bfa;font-size:10px;">Liq: ' + liqLines.length + '</span> ' +
            '<span style="color:#22d3ee;font-size:10px;">BOS: ' + bos + '</span>' +
            '</div>';
        content.innerHTML = html;
        setTimeout(function() { drawSmcOverlays(panel); }, 50);
    }

    // Add initial panels
    makeSmcPanel('BTCUSDT', '60');
    makeSmcPanel('ETHUSDT', '60');

    document.getElementById('add-panel').addEventListener('click', function() {
        var sym = document.getElementById('global-symbol').value;
        var iv = document.getElementById('global-interval').value;
        makeSmcPanel(sym, iv);
    });

    window.addEventListener('resize', function() {
        workspace.allPanels().forEach(function(p) {
            if (p.ui.chart && p.ui.chart.setSize && p.ui.chartContainer) {
                var el = p.ui.chartContainer;
                p.ui.chart.setSize(el.clientWidth || 400, el.clientHeight || 300);
            }
        });
    });
})();
</script>
</body>
</html>
