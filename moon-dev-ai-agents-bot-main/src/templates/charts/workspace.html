<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Dev Chart Workspace</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #070b12;
            --panel: #0d141e;
            --panel-raised: #121c28;
            --grid: #213040;
            --text: #e7eef7;
            --muted: #7f91a5;
            --green: #64e6a0;
            --red: #ff7887;
            --cyan: #58d9e8;
            --amber: #f5c96a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 42% -18%, #173042 0, transparent 42%), var(--bg);
            color: var(--text);
            font: 12px "SF Mono", "Fira Code", Consolas, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border-bottom: 1px solid var(--grid);
            background: rgba(13,20,30,.95);
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            color: var(--cyan);
            font-size: 14px;
            letter-spacing: .08em;
            white-space: nowrap;
        }
        h1::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin: 0 9px 2px 0;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }
        .workspace-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: auto;
            flex-wrap: wrap;
        }
        select, button {
            border: 1px solid var(--grid);
            border-radius: 5px;
            background: rgba(18,28,40,.9);
            color: var(--text);
            padding: 6px 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color .18s ease, background .18s ease;
        }
        select { min-width: 90px; }
        button:hover, select:focus {
            border-color: var(--cyan);
            background: var(--panel-raised);
            outline: none;
        }
        button:active { transform: translateY(1px); }
        button.primary {
            background: var(--cyan);
            color: #061017;
            border-color: var(--cyan);
            font-weight: 600;
        }
        button.primary:hover { background: #7be0f0; }
        button.danger {
            border-color: var(--red);
            color: var(--red);
        }
        button.danger:hover { background: rgba(255,120,135,.15); }
        .sync-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--grid);
            border-radius: 5px;
            background: rgba(18,28,40,.9);
            cursor: pointer;
            user-select: none;
        }
        .sync-toggle.active {
            border-color: var(--cyan);
            background: rgba(88,217,232,.1);
        }
        .sync-toggle input { accent-color: var(--cyan); }
        .sync-label { font-size: 11px; color: var(--muted); }
        .workspace-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            grid-auto-rows: minmax(400px, 1fr);
            gap: 8px;
            padding: 12px;
            min-height: 0;
            overflow: auto;
        }
        .chart-panel {
            background: var(--panel);
            border: 1px solid var(--grid);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--grid);
            background: rgba(18,28,40,.6);
            flex-shrink: 0;
        }
        .panel-type-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .panel-type-badge.footprint {
            background: rgba(100,230,160,.15);
            color: var(--green);
            border: 1px solid rgba(100,230,160,.3);
        }
        .panel-type-badge.smc {
            background: rgba(88,217,232,.15);
            color: var(--cyan);
            border: 1px solid rgba(88,217,232,.3);
        }
        .panel-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1;
        }
        .panel-controls select {
            padding: 4px 6px;
            font-size: 11px;
            min-width: 0;
        }
        .panel-controls select.symbol-select { width: 90px; }
        .panel-controls select.interval-select { width: 70px; }
        .panel-actions {
            display: flex;
            gap: 4px;
        }
        .panel-actions button {
            padding: 3px 8px;
            font-size: 11px;
        }
        .panel-body {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }
        .panel-body.footprint-panel {
            display: grid;
            grid-template-columns: 1fr 240px;
            grid-template-rows: 1fr 150px 80px;
        }
        .panel-body.footprint-panel .canvas-area {
            position: relative;
            min-height: 0;
            overflow: hidden;
        }
        .panel-body.footprint-panel .canvas-area canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .panel-body.footprint-panel .ai-side {
            border-left: 1px solid var(--grid);
            background: rgba(9,15,23,.8);
            overflow-y: auto;
            padding: 8px;
            font-size: 10px;
        }
        .panel-body.footprint-panel .ai-side .ai-title {
            color: var(--cyan);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .06em;
            margin-bottom: 6px;
        }
        .panel-body.footprint-panel .analysis-row {
            border-top: 1px solid var(--grid);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .panel-body.footprint-panel .analysis-row canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .panel-body.footprint-panel .stats-row {
            border-top: 1px solid var(--grid);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
        }
        .panel-body.footprint-panel .stats-row .stat-cell {
            padding: 6px 8px;
            border-right: 1px solid var(--grid);
            font-size: 10px;
            display: flex;
            flex-direction: column;
        }
        .panel-body.footprint-panel .stats-row .stat-cell .stat-label {
            color: var(--muted);
            font-size: 8px;
            letter-spacing: .06em;
        }
        .panel-body.footprint-panel .stats-row .stat-cell .stat-value {
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
        }
        .panel-body.smc-panel {
            display: flex;
            flex-direction: column;
        }
        .panel-body.smc-panel #chart-container {
            flex: 1;
            min-height: 0;
        }
        .panel-body.smc-panel .smc-side {
            width: 220px;
            border-left: 1px solid var(--grid);
            background: rgba(9,15,23,.7);
            overflow-y: auto;
            padding: 8px;
            font-size: 10px;
            flex-shrink: 0;
        }
        .panel-status {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 9px;
            color: var(--muted);
            letter-spacing: .04em;
            z-index: 5;
            pointer-events: none;
        }
        .panel-status.loaded { color: var(--green); }
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            font-size: 13px;
            gap: 10px;
        }
        .empty-state button {
            padding: 8px 16px;
        }
        @media (max-width: 960px) {
            .workspace-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: minmax(380px, auto);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>CHART WORKSPACE</h1>
        <div class="workspace-controls">
            <select id="global-symbol">
                <option>BTCUSDT</option>
                <option>ETHUSDT</option>
                <option>SOLUSDT</option>
                <option>BNBUSDT</option>
            </select>
            <select id="global-interval">
                <option value="60">1m</option>
                <option value="300">5m</option>
                <option value="900">15m</option>
            </select>
            <label class="sync-toggle" id="sync-toggle">
                <input type="checkbox" id="sync-enabled" checked>
                <span class="sync-label">SYNC symbol+interval</span>
            </label>
            <button id="add-panel" class="primary">+ ADD PANEL</button>
        </div>
    </header>
    <main class="workspace-grid" id="workspace-grid">
        <!-- Panels rendered by JS -->
    </main>

<script>
/* chart_workspace.js - shared panel/workspace model */
(function () {
  'use strict';

  var PANEL_TYPES = ['footprint', 'smc'];

  function createPanel(options) {
    options = options || {};
    var type = options.type || 'footprint';
    if (PANEL_TYPES.indexOf(type) === -1) {
      throw new Error('Unknown chart panel type: ' + type);
    }
    return {
      id: options.id || ('panel-' + Math.random().toString(36).slice(2, 10)),
      type: type,
      symbol: options.symbol || 'BTCUSDT',
      timeframe: options.timeframe || '60',
      chartStyle: options.chartStyle || '',
      indicators: options.indicators || {},
      drawings: options.drawings || [],
      overlays: options.overlays || [],
      markers: options.markers || [],
      data: options.data || null,
      ui: options.ui || null,
      hooks: options.hooks || null,
      private: options.private || {}
    };
  }

  function createWorkspace() {
    var panels = [];
    var activePanelId = null;
    function addPanel(panel) { panels.push(panel); if (!activePanelId) activePanelId = panel.id; return panel; }
    function removePanel(panelId) {
      var idx = -1;
      for (var i = 0; i < panels.length; i++) { if (panels[i].id === panelId) { idx = i; break; } }
      if (idx === -1) return null;
      var removed = panels.splice(idx, 1)[0];
      if (activePanelId === panelId) activePanelId = panels.length ? panels[0].id : null;
      return removed;
    }
    function getPanel(panelId) { for (var i = 0; i < panels.length; i++) { if (panels[i].id === panelId) return panels[i]; } return null; }
    function activePanel() { return activePanelId ? getPanel(activePanelId) : null; }
    function setActivePanel(panelId) { if (!getPanel(panelId)) return false; activePanelId = panelId; return true; }
    function allPanels() { return panels.slice(); }
    return {
      panels: panels, activePanelId: activePanelId,
      addPanel: addPanel, removePanel: removePanel,
      getPanel: getPanel, activePanel: activePanel,
      setActivePanel: setActivePanel, allPanels: allPanels
    };
  }

  function dispatchPanel(panel, action, payload) {
    if (!panel.hooks || typeof panel.hooks[action] !== 'function') return;
    return panel.hooks[action](panel, payload);
  }

  window.ChartWorkspace = {
    PANEL_TYPES: PANEL_TYPES,
    createPanel: createPanel,
    createWorkspace: createWorkspace,
    dispatchPanel: dispatchPanel
  };
})();
</script>

<script>
(function () {
    'use strict';
    var CW = window.ChartWorkspace;
    if (!CW) throw new Error('ChartWorkspace not available');

    // ── Workspace setup ──
    var workspace = CW.createWorkspace();
    var syncEnabled = document.getElementById('sync-enabled').checked;
    var syncToggle = document.getElementById('sync-toggle');
    syncToggle.classList.add('active');

    document.getElementById('sync-enabled').addEventListener('change', function () {
        syncEnabled = this.checked;
        syncToggle.classList.toggle('active', syncEnabled);
    });

    // ── Panel type registry ──
    // Each panel type provides: render(panel), destroy(panel), getHtml(panel)
    var panelRenderers = {};

    // ── Footprint panel renderer ──
    // Reuses the same logic as index.html but scoped to a panel instance
    (function () {
        var uiCache = {}; // per-panel UI cache

        function getUi(p) {
            if (uiCache[p.id]) return uiCache[p.id];
            var canvas = document.createElement('canvas');
            canvas.id = 'fp-canvas-' + p.id;
            var deltaCanvas = document.createElement('canvas');
            deltaCanvas.id = 'fp-delta-' + p.id;
            var profileCanvas = document.createElement('canvas');
            profileCanvas.id = 'fp-profile-' + p.id;
            var domCanvas = document.createElement('canvas');
            domCanvas.id = 'fp-dom-' + p.id;

            var ui = {
                canvas: canvas,
                context: canvas.getContext('2d'),
                deltaCanvas: deltaCanvas,
                deltaContext: deltaCanvas.getContext('2d'),
                profileCanvas: profileCanvas,
                profileContext: profileCanvas.getContext('2d'),
                domCanvas: domCanvas,
                domContext: domCanvas.getContext('2d'),
                tickSize: 0.1,
                sessionId: localStorage.getItem('moondev-chart-session') || crypto.randomUUID()
            };
            localStorage.setItem('moondev-chart-session', ui.sessionId);
            uiCache[p.id] = ui;
            return ui;
        }

        function escapeHtml(v) {
            return String(v).replace(/[&<>\"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; });
        }

        function formatVolume(p, v) {
            var n = Number(v);
            if (!Number.isFinite(n) || n === 0) return '0';
            var abs = Math.abs(n);
            var d = abs >= 1000 ? 0 : abs >= 1 ? 2 : abs >= 0.1 ? 3 : abs >= 0.001 ? 5 : 8;
            return n.toFixed(d);
        }

        function formatCompact(p, v) {
            var n = Number(v);
            if (!Number.isFinite(n) || n === 0) return '0';
            var abs = Math.abs(n);
            if (abs >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (abs >= 1000) return (n / 1000).toFixed(1) + 'K';
            if (abs >= 1) return n.toFixed(2);
            return n.toFixed(3);
        }

        function tickSizeFor(sym) {
            return { BTCUSDT: 0.10, ETHUSDT: 0.01, SOLUSDT: 0.001, BNBUSDT: 0.01 }[sym] || '0.01';
        }

        function resize(p) {
            var ui = getUi(p);
            var box = ui.canvas.getBoundingClientRect();
            var ratio = window.devicePixelRatio || 1;
            if (box.width > 0 && box.height > 0) {
                ui.canvas.width = Math.floor(box.width * ratio);
                ui.canvas.height = Math.floor(box.height * ratio);
                ui.context.setTransform(ratio, 0, 0, ratio, 0, 0);
                [ui.deltaCanvas, ui.profileCanvas, ui.domCanvas].forEach(function (c) {
                    var cb = c.getBoundingClientRect();
                    if (cb.width > 0 && cb.height > 0) {
                        c.width = Math.floor(cb.width * ratio);
                        c.height = Math.floor(cb.height * ratio);
                    }
                });
                ui.deltaContext.setTransform(ratio, 0, 0, ratio, 0, 0);
                ui.profileContext.setTransform(ratio, 0, 0, ratio, 0, 0);
                ui.domContext.setTransform(ratio, 0, 0, ratio, 0, 0);
            }
        }

        function groupBars(p, levels, candles) {
            var groups = new Map();
            levels.forEach(function (l) {
                if (!groups.has(l.bucket_time)) groups.set(l.bucket_time, []);
                groups.get(l.bucket_time).push(l);
            });
            var candleMap = new Map((candles || []).map(function (c) { return [c.bucket_time, c]; }));
            (candles || []).forEach(function (c) {
                if (!groups.has(c.bucket_time)) groups.set(c.bucket_time, []);
            });
            var entries = [];
            groups.forEach(function (rows, time) {
                var candle = candleMap.get(time);
                var prices = rows.map(function (r) { return Number(r.price); });
                var fallback = Number(candle ? candle.close : 0);
                entries.push({
                    time: time, rows: rows,
                    open: candle ? candle.open : (prices[0] != null ? prices[0] : fallback),
                    close: candle ? candle.close : (prices.length ? prices[prices.length - 1] : fallback),
                    high: candle ? candle.high : Math.max.apply(null, prices.concat([fallback])),
                    low: candle ? candle.low : Math.min.apply(null, prices.concat([fallback]))
                });
            });
            entries.sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
            return entries;
        }

        function drawCanvasBadge(p, label, x, baseline, color) {
            var ctx = getUi(p).context;
            ctx.save();
            ctx.font = '600 9px Consolas, monospace';
            var padding = 5;
            var w = ctx.measureText(label).width + padding * 2;
            var h = 15;
            var y = baseline - h + 3;
            ctx.fillStyle = 'rgba(7, 11, 18, .92)';
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 3);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + padding, y + h / 2);
            ctx.restore();
        }

        function summarizeSignals(p, signals) {
            var groups = new Map();
            signals.forEach(function (s) {
                var key = s.type + '-' + s.side;
                var cur = groups.get(key) || { type: s.type, side: s.side, count: 0, strength: 0 };
                cur.count += 1;
                cur.strength = Math.max(cur.strength, Number(s.strength) || 0);
                groups.set(key, cur);
            });
            var arr = [];
            groups.forEach(function (v) { arr.push(v); });
            var summary = arr[0];
            if (!summary) return 'SIGNAL';
            var label = summary.type === 'ABSORPTION' ? 'ABSORPTION ' + summary.side : 'STACK ' + summary.side + ' x' + (summary.strength || summary.count);
            return groups.size > 1 ? label + ' +' + (groups.size - 1) : label;
        }

        function drawCellValue(p, value, cellX, centerY, cellWidth, cellHeight) {
            var ctx = getUi(p).context;
            var padding = 3;
            var aw = Math.max(1, cellWidth - padding * 2);
            var ah = Math.max(1, cellHeight - 1);
            var labels = [formatVolume(p, value), formatCompact(p, value), Number(value).toExponential(1)];
            var lbl = labels[0];
            var fontSize = Math.min(10, ah * .72);
            for (var ci = 0; ci < labels.length; ci++) {
                ctx.font = fontSize + 'px Consolas, monospace';
                if (ctx.measureText(labels[ci]).width <= aw) { lbl = labels[ci]; break; }
                lbl = labels[ci];
            }
            ctx.font = fontSize + 'px Consolas, monospace';
            var mw = ctx.measureText(lbl).width;
            fontSize = Math.max(.5, Math.min(fontSize, fontSize * aw / Math.max(mw, 1)));
            ctx.font = fontSize + 'px Consolas, monospace';
            ctx.save();
            ctx.beginPath();
            ctx.rect(cellX, centerY - cellHeight / 2, cellWidth, cellHeight);
            ctx.clip();
            ctx.textBaseline = 'middle';
            ctx.fillText(lbl, cellX + padding, centerY);
            ctx.restore();
        }

        function render(p) {
            var ui = getUi(p);
            var ctx = ui.context;
            var width = ui.canvas.clientWidth;
            var height = ui.canvas.clientHeight;
            if (width === 0 || height === 0) return;
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#090b10';
            ctx.fillRect(0, 0, width, height);

            var left = 16, top = 96, right = 78, bottom = 42;
            var plotWidth = Math.max(1, width - left - right);
            var plotHeight = Math.max(1, height - top - bottom);
            var end = Math.max(0, p.data.bars.length - p.data.offset);
            var visibleBars = p.data.bars.slice(Math.max(0, end - p.data.visible), end);

            if (!visibleBars.length) {
                ctx.fillStyle = '#778292'; ctx.font = '12px Consolas, monospace';
                ctx.fillText('No Binance trades yet. Start the collector.', left, top + 28);
                return;
            }

            var prices = [];
            visibleBars.forEach(function (bar) {
                if (bar.rows.length) bar.rows.forEach(function (r) { prices.push(Number(r.price)); });
                else { prices.push(bar.open, bar.high, bar.low, bar.close); }
            });
            var minPrice = Math.min.apply(null, prices), maxPrice = Math.max.apply(null, prices);
            var range = Math.max(maxPrice - minPrice, maxPrice * 0.0001, 0.00000001);
            var targetColumnWidth = Math.max(80, Math.min(120, plotWidth / Math.max(p.data.visible, 1)));
            var zoomScale = 30 / Math.max(p.data.visible, 1);
            var chartWidth = Math.min(plotWidth, Math.max(120, visibleBars.length * targetColumnWidth * zoomScale));
            var chartLeft = left + (plotWidth - chartWidth) / 2;
            var xStep = chartWidth / Math.max(visibleBars.length, 1);
            var displayStep = ui.tickSize * Math.max(1, Math.ceil(range / (ui.tickSize * Math.max(10, Math.min(24, Math.floor(plotHeight / 25))))));
            var displayHigh = Math.ceil(maxPrice / displayStep) * displayStep;
            var displayRange = Math.max(displayHigh - Math.floor(minPrice / displayStep) * displayStep, displayStep);
            var priceY = function (pr) { return top + (displayHigh - pr) / displayRange * plotHeight; };

            p.data.view = {
                chartLeft: chartLeft, xStep: xStep, top: top, plotHeight: plotHeight,
                displayHigh: displayHigh, displayRange: displayRange, visibleBars: visibleBars
            };

            var displayRows = [];
            for (var di = 0; di <= Math.round(displayRange / displayStep); di++)
                displayRows.push(displayHigh - di * displayStep);

            var groupedRows = function (bar) {
                var grouped = new Map();
                bar.rows.forEach(function (row) {
                    var price = Math.floor(Number(row.price) / displayStep) * displayStep;
                    var cur = grouped.get(price) || { buy_volume: 0, sell_volume: 0, delta: 0, total_volume: 0 };
                    cur.buy_volume += Number(row.buy_volume); cur.sell_volume += Number(row.sell_volume);
                    cur.delta += Number(row.delta); cur.total_volume += Number(row.total_volume);
                    grouped.set(price, cur);
                });
                return grouped;
            };

            // Grid lines + header
            ctx.strokeStyle = '#202733'; ctx.lineWidth = 1;
            for (var li = 0; li <= 5; li++) {
                var lineY = top + li * plotHeight / 5;
                ctx.beginPath(); ctx.moveTo(left, lineY); ctx.lineTo(left + plotWidth, lineY); ctx.stroke();
                if (li % 2 === 0 || li === 5) {
                    ctx.fillStyle = '#778292'; ctx.font = '10px Consolas, monospace';
                    ctx.fillText((displayHigh - li * displayRange / 5).toFixed(Math.min(4, Math.max(2, ui.tickSize < 1 ? 3 : 2))), left + plotWidth + 8, lineY + 3);
                }
            }
            ctx.fillStyle = '#0d141e'; ctx.fillRect(left, top - 54, plotWidth, 38);
            ctx.strokeStyle = '#213040'; ctx.strokeRect(left, top - 54, plotWidth, 38);
            ctx.fillStyle = '#64e6a0'; ctx.font = '600 10px Consolas, monospace'; ctx.fillText('BUY VOLUME', left + 10, top - 36);
            ctx.fillStyle = '#ff7887'; ctx.fillText('SELL VOLUME', left + plotWidth - 78, top - 36);
            ctx.fillStyle = '#7f91a5'; ctx.font = '9px Consolas, monospace'; ctx.fillText('PRICE LEVEL', left + 10, top - 23);

            visibleBars.forEach(function (bar, index) {
                var x = chartLeft + index * xStep;
                var barDelta = bar.rows.reduce(function (s, r) { return s + Number(r.delta); }, 0);
                var cellWidth = Math.max(8, Math.min(44, xStep * .34));

                // Render with updated overlays

                updateStats(p, p.ui.statsContainer);
            }).catch(function () {});

        function applyAiIndicators(p, indicators) {
            if (!p.ui.chart || !p.ui.candleSeries) return;
            var closes = p.data.smcData ? p.data.smcData.candles.map(function (c) { return c.close; }) : [];
            var times = p.data.smcData ? p.data.smcData.candles.map(function (c) { return c.time; }) : [];
            if (!closes.length) return;

            indicators.forEach(function (ind) {
                var name = ind.name || '';
                var series = null;
                var label = '';
                var color = '#22d3ee';

                if (name === 'ema_9' || name === 'ema_21' || name === 'ema_50' || name === 'ema_200') {
                    var period = parseInt(name.replace('ema_', ''));
                    var ema = computeEMA(p, closes, period);
                    series = p.ui.chart.addLineSeries({ color: color, lineWidth: 1 });
                    series.setData(times.map(function (t, i) { return ema[i] !== null ? { time: t, value: ema[i] } : null; }).filter(Boolean));
                    label = name.toUpperCase();
                } else if (name === 'rsi_14') {
                    var rsi = computeRSI(p, closes, 14);
                    if (rsi.length && rsi.some(function (r) { return r.value !== null; })) {
                        var avgRsi = rsi.reduce(function (a, b) { return a + b.value; }, 0) / rsi.length;
                        var pl = p.ui.candleSeries.createPriceLine({ price: avgRsi, color: '#a78bfa', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'RSI Avg' });
                        p.indicators.rsi_14 = { series: pl, label: 'RSI 14 (avg)', color: '#a78bfa', enabled: true, visible: true, isPriceLine: true };
                        updateIndicatorPanel(p);
                        return;
                    }
                } else if (name === 'atr_14') {
                    var atr = computeATR(p, p.data.smcData.candles, 14);
                    if (atr !== null) {
                        var pl = p.ui.candleSeries.createPriceLine({ price: atr, color: '#ff6b35', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'ATR' });
                        p.indicators.atr_14 = { series: pl, label: 'ATR 14', color: '#ff6b35', enabled: true, visible: true, isPriceLine: true };
                        updateIndicatorPanel(p);
                        return;
                    }
                } else if (name === 'bollinger_20') {
                    var bb = computeBollinger(p, closes, 20, 2.0);
                    if (bb.upper && bb.upper.length) {
                        series = p.ui.chart.addLineSeries({ color: '#fbbf24', lineWidth: 1 });
                        series.setData(times.map(function (t, i) { return bb.upper[i] !== null ? { time: t, value: bb.upper[i] } : null; }).filter(Boolean));
                        var series2 = p.ui.chart.addLineSeries({ color: '#fbbf24', lineWidth: 1, lineStyle: 2 });
                        series2.setData(times.map(function (t, i) { return bb.lower[i] !== null ? { time: t, value: bb.lower[i] } : null; }).filter(Boolean));
                        label = 'BB (20,2)';
                    }
                } else if (name === 'macd_12_26_9') {
                    var macd = computeMACD(p, closes);
                    if (macd.macd && macd.macd.length) {
                        series = p.ui.chart.addLineSeries({ color: '#22d3ee', lineWidth: 1 });

                        var sig = p.ui.chart.addLineSeries({ color: '#a78bfa', lineWidth: 1, lineStyle: 2 });
                        sig.setData(times.map(function (t, i) { return macd.signal[i] !== null ? { time: t, value: macd.signal[i] } : null; }).filter(Boolean));
                        label = 'MACD';

                if (series) {
                    var key = name + '_' + Date.now();
                    p.indicators[key] = { series: series, label: label, color: color, enabled: true, visible: true };

        function computeEMA(data, period) {
            if (data.length < period) return [];
            var result = new Array(period - 1).fill(null);
            var multiplier = 2 / (period + 1);
            var k = data[0];
            for (var i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                k = (data[i] - k) * multiplier + k;
                result.push(k);
            }
            return result;
        }

        function computeRSI(data, period) {
            if (data.length < period + 1) return [];
            var gains = [], losses = [];
            for (var i = 1; i < data.length; i++) {
                var diff = data[i] - data[i - 1];
                gains.push(diff > 0 ? diff : 0);
                losses.push(diff < 0 ? -diff : 0);
            }
            var avgGain = gains.slice(0, period).reduce(function (a, b) { return a + b; }, 0) / period;
            var avgLoss = losses.slice(0, period).reduce(function (a, b) { return a + b; }, 0) / period;
            var result = [{ value: null }];
            for (var j = period; j < gains.length; j++) {
                avgGain = (avgGain * (period - 1) + gains[j]) / period;
                avgLoss = (avgLoss * (period - 1) + losses[j]) / period;
                var rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                result.push({ value: 100 - 100 / (1 + rs) });
            }
            return result;
        }

        function computeATR(candles, period) {
            if (candles.length < period + 1) return null;
            var trs = [];
            for (var i = 1; i < candles.length; i++) {
                var h = candles[i].high, l = candles[i].low, pc = candles[i - 1].close;
                var tr = Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
                trs.push(tr);
            }
            var atr = trs.slice(0, period).reduce(function (a, b) { return a + b; }, 0) / period;
            for (var k = period; k < trs.length; k++) {
                atr = (atr * (period - 1) + trs[k]) / period;
            }
            return atr;
        }

        function computeBollinger(closes, period, stdDev) {
            if (closes.length < period) return { upper: [], lower: [], middle: [] };
            var upper = [], lower = [], middle = [];
            for (var i = period - 1; i < closes.length; i++) {
                var window = closes.slice(i - period + 1, i + 1);
                var sma = window.reduce(function (a, b) { return a + b; }, 0) / period;
                var variance = window.reduce(function (a, b) { return a + (b - sma) * (b - sma); }, 0) / period;
                var sd = Math.sqrt(variance);
                middle.push(sma);
                upper.push(sma + stdDev * sd);
                lower.push(sma - stdDev * sd);
            }
            return { upper: upper, lower: lower, middle: middle };
        }

        function computeMACD(closes) {
            var fastPeriod = 12, slowPeriod = 26, signalPeriod = 9;
            if (closes.length < slowPeriod + signalPeriod) return { macd: [], signal: [], histogram: [] };
            var fastEMA = computeEMA(null, closes, fastPeriod);
            var slowEMA = computeEMA(null, closes, slowPeriod);
            var macdLine = [];
            for (var i = 0; i < closes.length; i++) {
                if (fastEMA[i] !== null && slowEMA[i] !== null) {
                    macdLine.push(fastEMA[i] - slowEMA[i]);
                } else {
                    macdLine.push(null);
                }
            }
            var validMacd = macdLine.filter(function (v) { return v !== null; });
            if (validMacd.length < signalPeriod) return { macd: [], signal: [], histogram: [] };
            var signalEMA = computeEMA(null, validMacd, signalPeriod);
            var signalLine = [];
            var histogram = [];
            var validIdx = 0;
            for (var j = 0; j < macdLine.length; j++) {
                if (macdLine[j] !== null) {
                    signalLine.push(signalEMA[validIdx] !== null ? signalEMA[validIdx] : null);
                    histogram.push(macdLine[j] - (signalEMA[validIdx] !== null ? signalEMA[validIdx] : 0));
                    validIdx++;
                } else {
                    signalLine.push(null);
                    histogram.push(null);
                }
            }
            return { macd: macdLine, signal: signalLine, histogram: histogram };
        }

        function renderChart(p) {
            if (!p.ui.chart || !p.data.smcData || !p.data.smcData.candles) return;
            var candles = p.data.smcData.candles;
            p.ui.candleSeries.setData(candles);

            // Update indicators
            for (var key in p.indicators) {
                var ind = p.indicators[key];

                if (ind.isPriceLine) continue;
                if (ind.label.indexOf('EMA') === 0) {
                    var closes = candles.map(function (c) { return c.close; });
                    var period = parseInt(ind.label.replace('EMA ', ''));
                    var ema = computeEMA(closes, period);
                    if (ema.length) {
                        var times = candles.map(function (c) { return c.time; });
                        ind.series.setData(times.map(function (t, i) { return ema[i] !== null ? { time: t, value: ema[i] } : null; }).filter(Boolean));
                    }
                }
            }
        }

        function clearSMCOverlays(p) {

                p.data.obLines.push({ marker: marker, ...ob });

        async function loadChart(p) {

            if (statusEl) statusEl.textContent = 'Loading ' + sym + '...';

            try {
                var response = await fetch('/api/smc?symbol=' + sym + '&timeframe=' + p.timeframe);
                p.data.smcData = await response.json();
                if (statusEl) statusEl.textContent = 'Loaded';
                if (statusEl) statusEl.classList.add('loaded');

                // Initialize chart if not already
                if (!p.ui.chart) {
                    initChart(p);
                }

                renderChart(p);
                analyzeSMC(p);
                refreshAiMarkers(p);
            } catch (error) {
                if (statusEl) statusEl.textContent = 'Error';
            }
        }

        function refreshAiMarkers(p) {
            if (!p.data.snapshot) return;
            p.data.obLines = (p.data.obLines || []).filter(function (line) { return line.price !== undefined; });
            p.data.fvgAreas = (p.data.fvgAreas || []).filter(function (area) { return area.price !== undefined || area.low !== undefined; });
            p.data.liqLines = (p.data.liqLines || []).filter(function (line) { return line.price !== undefined; });
        }

        function initChart(p) {
            var container = p.ui.chartContainer;
            var clientWidth = container.clientWidth || 400;
            var clientHeight = container.clientHeight || 300;

            var chart = LightweightCharts.createChart(container, {
                width: clientWidth,
                height: clientHeight,
                layout: { background: { color: '#0a0a0f' }, textColor: '#666' },
                grid: { vertLines: { color: '#1e1e2e' }, horzLines: { color: '#1e1e2e' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                handleScroll: { vertTouchDrag: false },
                handleScale: { axisPressedMouseMove: true },
            });
            chart.applyOptions({ width: clientWidth, height: clientHeight });

            var candleSeries = chart.addCandlestickSeries({
                upColor: '#4ade80',
                downColor: '#f87171',
                borderUpColor: '#4ade80',
                borderDownColor: '#f87171',
                wickUpColor: '#4ade80',
                wickDownColor: '#f87171'
            });

            var volumeSeries = chart.addHistogramSeries({
                priceFormat: { type: 'volume' },
                priceScaleId: 'volume',
                color: '#22d3ee'
            });
            chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

            p.ui.chart = chart;
            p.ui.candleSeries = candleSeries;
            p.ui.volumeSeries = volumeSeries;

            // Handle resize
            var resizeObserver = new ResizeObserver(function () {
                var w = container.clientWidth || 400;
                var h = container.clientHeight || 300;
                chart.applyOptions({ width: w, height: h });
            });
            resizeObserver.observe(container);

            // Legend
            var legend = document.createElement('div');
            legend.style.cssText = 'display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;font-size:10px;';
            legend.innerHTML =
                '<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#4ade80;"></div> Demand</div>' +
                '<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#f87171;"></div> Supply</div>' +
                '<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#fbbf24;"></div> FVG</div>' +
                '<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#22d3ee;"></div> BOS</div>' +
                '<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:#a78bfa;"></div> Liquidity</div>';
            container.parentNode.insertBefore(legend, container.nextSibling);
        }

        function analyzeSMC(p) {
            if (!p.data.smcData || !p.data.smcData.candles) return;
            var content = document.getElementById('smc-content-' + p.id);
            if (!content) return;

            var candles = p.data.smcData.candles;
            var obLines = [];
            var fvgAreas = [];
            var liqLines = [];

            // Simple SMC detection - find swing highs/lows, FVGs
            for (var i = 2; i < candles.length - 2; i++) {
                // Order blocks: 3 consecutive candles where last one breaks structure
                if (candles[i].close > candles[i-1].close && candles[i-1].close > candles[i-2].close) {
                    obLines.push({
                        time: candles[i].time,
                        high: candles[i].high,
                        low: candles[i].low,
                        type: 'demand'
                    });
                }
                if (candles[i].close < candles[i-1].close && candles[i-1].close < candles[i-2].close) {
                    obLines.push({
                        time: candles[i].time,
                        high: candles[i].high,
                        low: candles[i].low,
                        type: 'supply'
                    });
                }

                // FVG: gap between wicks
                if (candles[i].high < candles[i+1].low) {
                    fvgAreas.push({
                        time: candles[i+1].time,
                        high: candles[i+1].low,
                        low: candles[i].high
                    });
                }
                if (candles[i].low > candles[i+1].high) {
                    fvgAreas.push({
                        time: candles[i+1].time,
                        high: candles[i+1].high,
                        low: candles[i].low
                    });
                }
            }

            // Liquidity: recent highs/lows
            var recentHighs = [];
            var recentLows = [];
            for (var j = candles.length - 20; j < candles.length; j++) {
                if (candles[j].high > candles[j-1].high && candles[j].high > candles[j+1].high) {
                    recentHighs.push({ price: candles[j].high, time: candles[j].time });
                }
                if (candles[j].low < candles[j-1].low && candles[j].low < candles[j+1].low) {
                    recentLows.push({ price: candles[j].low, time: candles[j].time });
                }
            }

            p.data.obLines = obLines;
            p.data.fvgAreas = fvgAreas;
            p.data.liqLines = recentHighs.concat(recentLows);

            // Render content
            var html = '';
            html += '<div style="margin-bottom:8px;">';
            html += '<div style="color:#4ade80;font-size:10px;margin-bottom:4px;">Demand Zones: ' + obLines.filter(function (o) { return o.type === 'demand'; }).length + '</div>';
            html += '<div style="color:#f87171;font-size:10px;margin-bottom:4px;">Supply Zones: ' + obLines.filter(function (o) { return o.type === 'supply'; }).length + '</div>';
            html += '<div style="color:#fbbf24;font-size:10px;margin-bottom:4px;">FVGs: ' + fvgAreas.length + '</div>';
            html += '<div style="color:#a78bfa;font-size:10px;margin-bottom:4px;">Liquidity: ' + (recentHighs.length + recentLows.length) + '</div>';
            html += '</div>';

            // BOS detection
            var bosCount = 0;
            for (var k = 3; k < candles.length - 3; k++) {
                if (candles[k].close > candles[k-1].close && candles[k-1].close > candles[k-2].close &&
                    candles[k-2].close > candles[k-3].close) {
                    bosCount++;
                }
                if (candles[k].close < candles[k-1].close && candles[k-1].close < candles[k-2].close &&
                    candles[k-2].close < candles[k-3].close) {
                    bosCount++;
                }
            }
            html += '<div style="color:#22d3ee;font-size:10px;">BOS: ' + bosCount + '</div>';

            content.innerHTML = html;

            // Draw overlays after a short delay to ensure chart is ready
            setTimeout(function () {
                clearSMCOverlays(p);
                drawSMCOverlays(p);
                p.ui.chart && p.ui.chart.timeScale().fitContent();
            }, 100);
        }

        // Indicator management
        function updateIndicatorPanel(p) {
            var el = document.getElementById('smc-indicator-panel-' + p.id);
            if (!el) return;
            var html = '<div style="color:var(--muted);font-size:9px;letter-spacing:.06em;margin-bottom:4px;">ACTIVE</div>';

            for (var key in p.indicators) {
                var ind = p.indicators[key];
                if (!ind || !ind.series) continue;
                var toggleIcon = ind.visible ? '👁' : '👁‍🗨';
                var toggleClass = ind.visible ? 'active' : '';
                html += '<div class="indicator-item ' + toggleClass + '" style="display:flex;align-items:center;gap:6px;padding:4px 6px;margin:2px 0;border-radius:4px;background:rgba(255,255,255,0.03);border:1px solid var(--border);">' +
                    '<span style="width:8px;height:8px;border-radius:50%;background:' + ind.color + ';flex-shrink:0;"></span>' +
                    '<span style="flex:1;font-size:10px;">' + ind.label + '</span>' +
                    '<button class="indicator-btn toggle" data-key="' + key + '" data-panel="' + p.id + '" style="padding:2px 6px;font-size:10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text);cursor:pointer;">' + toggleIcon + '</button>' +
                    '<button class="indicator-btn remove" data-key="' + key + '" data-panel="' + p.id + '" style="padding:2px 6px;font-size:10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--red);cursor:pointer;">✕</button>' +
                    '</div>';
            }

            // Add indicator dropdown
            html += '<div style="margin-top:8px;border-top:1px solid var(--grid);padding-top:6px;">' +
                '<select id="add-indicator-' + p.id + '" style="width:100%;padding:4px;background:#0a1018;border:1px solid var(--border);color:var(--text);font:inherit;font-size:10px;border-radius:3px;">' +
                '<option value="">+ Add Indicator</option>' +
                '<option value="ema_50">EMA 50</option>' +
                '<option value="ema_200">EMA 200</option>' +
                '<option value="rsi_14">RSI 14</option>' +
                '<option value="atr_14">ATR 14</option>' +
                '</select>' +
                '</div>';

            el.innerHTML = html;

            // Bind toggle buttons
            el.querySelectorAll('.indicator-btn.toggle').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var key = btn.dataset.key;
                    var panelId = btn.dataset.panel;
                    var panel = workspace.getPanel(panelId);
                    if (!panel) return;
                    var ind = panel.indicators[key];
                    if (ind && ind.series) {
                        ind.visible = !ind.visible;
                        ind.series.applyOptions({ visible: ind.visible });
                        updateIndicatorPanel(panel);
                    }
                });
            });

            // Bind remove buttons
            el.querySelectorAll('.indicator-btn.remove').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var key = btn.dataset.key;
                    var panelId = btn.dataset.panel;
                    var panel = workspace.getPanel(panelId);
                    if (!panel) return;
                    var ind = panel.indicators[key];
                    if (ind && ind.series) {
                        try { panel.ui.chart.removeSeries(ind.series); } catch (e) {}
                        ind.series = null;
                        ind.enabled = false;
                        updateIndicatorPanel(panel);
                    }
                });
            });

            // Bind add indicator
            var addSelect = el.querySelector('#add-indicator-' + p.id);
            if (addSelect) {
                addSelect.addEventListener('change', function () {
                    var val = addSelect.value;
                    if (val) addNewIndicator(p, val);
                    addSelect.value = '';
                });
            }
        }

        function addNewIndicator(p, type) {
            if (!p.ui.chart || !p.data.smcData || !p.data.smcData.candles) return;
            var candles = p.data.smcData.candles;
            var closes = candles.map(function (c) { return c.close; });
            var times = candles.map(function (c) { return c.time; });

            var series = null;
            var label = '';
            var color = '#22d3ee';

            switch (type) {
                case 'ema_50':
                    var ema50 = computeEMA(closes, 50);
                    series = p.ui.chart.addLineSeries({ color: '#4ade80', lineWidth: 1 });
                    series.setData(times.map(function (t, i) { return ema50[i] !== null ? { time: t, value: ema50[i] } : null; }).filter(Boolean));
                    label = 'EMA 50';
                    color = '#4ade80';
                    break;
                case 'ema_200':
                    var ema200 = computeEMA(closes, 200);
                    series = p.ui.chart.addLineSeries({ color: '#f87171', lineWidth: 1 });
                    series.setData(times.map(function (t, i) { return ema200[i] !== null ? { time: t, value: ema200[i] } : null; }).filter(Boolean));
                    label = 'EMA 200';
                    color = '#f87171';
                    break;
                case 'rsi_14':
                    var rsi = computeRSI(closes, 14);
                    if (rsi.length && rsi.some(function (r) { return r.value !== null; })) {
                        var validRsi = rsi.filter(function (r) { return r.value !== null; });
                        var avgRsi = validRsi.reduce(function (a, b) { return a + b.value; }, 0) / validRsi.length;
                        var pl = p.ui.candleSeries.createPriceLine({ price: avgRsi, color: '#a78bfa', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'RSI Avg' });
                        p.indicators.rsi_14 = { series: pl, label: 'RSI 14 (avg)', color: '#a78bfa', enabled: true, visible: true, isPriceLine: true };
                        updateIndicatorPanel(p);
                        return;
                    }
                    break;
                case 'atr_14':
                    var atr = computeATR(candles, 14);
                    if (atr !== null) {
                        var pl = p.ui.candleSeries.createPriceLine({ price: atr, color: '#ff6b35', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'ATR' });
                        p.indicators.atr_14 = { series: pl, label: 'ATR 14', color: '#ff6b35', enabled: true, visible: true, isPriceLine: true };
                        updateIndicatorPanel(p);
                        return;
                    }
                    break;
            }

            if (series) {
                var key = type + '_' + Date.now();
                p.indicators[key] = { series: series, label: label, color: color, enabled: true, visible: true };
                updateIndicatorPanel(p);
            }
        }

        // Register SMC renderer
        panelRenderers['smc'] = {
            createDom: createSmcDom,
            render: renderChart,
            load: loadChart,
            analyzeSMC: analyzeSMC,
            updateIndicatorPanel: updateIndicatorPanel,
            addNewIndicator: addNewIndicator,
            clearSMCOverlays: clearSMCOverlays,
            drawSMCOverlays: drawSMCOverlays
        };
    })();

    // ── Panel management ──
    var panelCounter = 0;

    function createPanelElement(panel) {
        var grid = document.getElementById('workspace-grid');
        var panelDiv = document.createElement('div');
        panelDiv.id = 'panel-' + panel.id;
        panelDiv.className = 'chart-panel';

        var header = document.createElement('div');
        header.className = 'panel-header';
        header.innerHTML =
            '<span class="panel-type-badge ' + panel.type + '">' + panel.type.toUpperCase() + '</span>' +
            '<div class="panel-controls">' +
                '<select class="symbol-select" data-panel="' + panel.id + '">' +
                    '<option>BTCUSDT</option>' +
                    '<option>ETHUSDT</option>' +
                    '<option>SOLUSDT</option>' +
                    '<option>BNBUSDT</option>' +
                '</select>' +
                '<select class="interval-select" data-panel="' + panel.id + '">' +
                    '<option value="60">1m</option>' +
                    '<option value="300">5m</option>' +
                    '<option value="900">15m</option>' +
                '</select>' +
            '</div>' +
            '<div class="panel-actions">' +
                '<button class="danger remove-panel" data-panel="' + panel.id + '" title="Close panel">✕</button>' +
            '</div>';
        panelDiv.appendChild(header);

        var body = document.createElement('div');
        body.className = 'panel-body';
        body.id = 'panel-body-' + panel.id;
        panelDiv.appendChild(body);

        // Status indicator
        var status = document.createElement('div');
        status.className = 'panel-status';
        status.id = 'panel-status-' + panel.id;
        status.textContent = 'Initializing...';
        panelDiv.appendChild(status);

        grid.appendChild(panelDiv);

        // Wire symbol selector
        var symSelect = header.querySelector('.symbol-select');
        symSelect.value = panel.symbol;
        symSelect.addEventListener('change', function () {
            var newSym = symSelect.value;
            panel.symbol = newSym;
            if (syncEnabled) {
                workspace.allPanels().forEach(function (other) {
                    if (other.id !== panel.id) {
                        var otherSelect = document.querySelector('.symbol-select[data-panel="' + other.id + '"]');
                        if (otherSelect) otherSelect.value = newSym;
                        other.symbol = newSym;
                        if (other.hooks && other.hooks['load']) other.hooks['load'](other);
                    }
                });
            }
            if (panel.hooks && panel.hooks['load']) panel.hooks['load'](panel);
        });

        // Wire interval selector
        var intSelect = header.querySelector('.interval-select');
        intSelect.value = panel.timeframe;
        intSelect.addEventListener('change', function () {
            var newIv = intSelect.value;
            panel.timeframe = newIv;
            if (syncEnabled) {
                workspace.allPanels().forEach(function (other) {
                    if (other.id !== panel.id) {
                        var otherSelect = document.querySelector('.interval-select[data-panel="' + other.id + '"]');
                        if (otherSelect) otherSelect.value = newIv;
                        other.timeframe = newIv;
                        if (other.hooks && other.hooks['load']) other.hooks['load'](other);
                    }
                });
            }
            if (panel.hooks && panel.hooks['load']) panel.hooks['load'](panel);
        });

        // Wire remove button
        header.querySelector('.remove-panel').addEventListener('click', function () {
            removePanel(panel.id);
        });

        var renderer = panelRenderers[panel.type];
        if (renderer && renderer.createDom) {
            renderer.createDom(panel);
        }

        // Add tool buttons for footprint panels
        if (panel.type === 'footprint') {
            var toolBar = document.createElement('div');
            toolBar.style.cssText = 'position:absolute;top:36px;right:10px;display:flex;gap:4px;z-index:3;';
            toolBar.innerHTML =
                '<button class="panel-tool-btn" data-tool="zoom-in" title="Zoom in" style="padding:3px 6px;font-size:10px;">+</button>' +
                '<button class="panel-tool-btn" data-tool="zoom-out" title="Zoom out" style="padding:3px 6px;font-size:10px;">−</button>' +
                '<button class="panel-tool-btn" data-tool="reset" title="Reset zoom" style="padding:3px 6px;font-size:10px;">Reset</button>' +
                '<button class="panel-tool-btn" data-tool="crosshair" title="Crosshair" style="padding:3px 6px;font-size:10px;">✛</button>' +
                '<button class="panel-tool-btn" data-tool="settings" title="Toggle legend" style="padding:3px 6px;font-size:10px;">⚙</button>';
            body.appendChild(toolBar);
        }

        workspace.addPanel(panel);
        return panelDiv;
    }

    function removePanel(panelId) {
        var panel = workspace.getPanel(panelId);
        if (!panel) return;
        var renderer = panelRenderers[panel.type];
        if (renderer && renderer.destroy) {
            renderer.destroy(panel);
        }
        var panelEl = document.getElementById('panel-' + panelId);
        if (panelEl) panelEl.remove();
        workspace.removePanel(panelId);
    }

    function addPanel() {
        panelCounter++;
        var types = ['footprint', 'smc'];
        var type = types[panelCounter % 2]; // Alternate types
        var panel = CW.createPanel({
            type: type,
            symbol: document.getElementById('global-symbol').value,
            timeframe: document.getElementById('global-interval').value,
            data: { bars: [], signals: [], snapshot: null, drawings: [], drawingTool: null, pendingAnchor: null, view: null, agents: {}, obLines: [], fvgAreas: [], liqLines: [], smcData: null, rbiHighlightedStrategy: null },
            ui: {},
            hooks: { load: function (p) {
                var r = panelRenderers[p.type];
                if (r && r.load) r.load(p);
            }}
        });
        createPanelElement(panel);
    }

    // ── Initialize with 2 panels ──
    addPanel(); // footprint
    addPanel(); // smc

    // ── Add panel button ──
    document.getElementById('add-panel').addEventListener('click', addPanel);

    // ── Global refresh ──
    window.addEventListener('resize', function () {
        workspace.allPanels().forEach(function (p) {
            var r = panelRenderers[p.type];
            if (r && r.resize) r.resize(p);
        });
    });

})();
</script>
</body>
</html>
